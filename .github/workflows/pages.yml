name: pages

# Opt-in: set repository variable PAGES_ENABLED=true and Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/*.md
      - assets/**
      - skills/*/assets/**
      - .github/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage site
        run: |
          set -eu
          # Stage inside the workspace: the Jekyll container action cannot see RUNNER_TEMP.
          site=_pages
          mkdir -p "$site/docs" "$site/assets"
          cp README.md "$site/index.md"
          cp .github/pages/_config.yml "$site/_config.yml"
          cp docs/*.md "$site/docs/"
          cp assets/*.svg assets/*.png "$site/assets/" 2>/dev/null || true
          for d in skills/*/assets; do
            [ -d "$d" ] || continue
            mkdir -p "$site/$d"
            cp "$d"/*.svg "$site/$d/" 2>/dev/null || true
          done
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_pages
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
